name: CI

on:
  push:
    branches: [production]
  pull_request:
    branches: [production]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        crystal: ["1.21.1"]
    container:
      image: crystallang/crystal:${{ matrix.crystal }}
    steps:
      - uses: actions/checkout@v4
      - run: shards install
      - run: crystal spec
      - run: crystal tool format --check src/ spec/
      - run: crystal run lib/ameba/bin/ameba.cr --

  build:
    runs-on: ubuntu-latest
    container:
      image: crystallang/crystal:1.21.1.1
    steps:
      - uses: actions/checkout@v4
      - run: shards build
